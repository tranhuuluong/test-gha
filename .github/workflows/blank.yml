name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Lint • Unit Tests • Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write
      checks: write
      id-token: write

    steps:
      # --------------------------
      # Checkout repository
      # --------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------
      # Install JDK
      # --------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --------------------------
      # Cache Gradle
      # --------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # --------------------------
      # Gradle permissions
      # --------------------------
      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      # --------------------------
      # Run Lint
      # --------------------------
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint.html
          if-no-files-found: warn

      # --------------------------
      # Unit Tests
      # --------------------------
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      # --------------------------
      # Build APK (after tests)
      # --------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # --------------------------
      # Summary output
      # --------------------------
      - name: Post Summary
        if: always()
        run: |
          echo "## Android CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 **Lint Report** (download from artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 **Unit Test Reports** (download from artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Debug APK** (download from artifacts)" >> $GITHUB_STEP_SUMMARY
