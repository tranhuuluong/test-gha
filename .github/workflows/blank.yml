name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Build, Lint, Test & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write
      checks: write
      id-token: write

    steps:
      # --- Checkout source code ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Set up JDK ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- Cache Gradle ---
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # --- Gradle Permissions ---
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # --- Lint Check ---
      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      # --- Build ---
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # --- Unit Tests ---
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

      - name: Upload Unit Test Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      # --- Summary Output in GitHub Actions (optional) ---
      - name: Post Summary
        if: always()
        run: |
          echo "## ✅ Android CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: [View Report](./lint-report)" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: [View Report](./unit-test-report)" >> $GITHUB_STEP_SUMMARY
