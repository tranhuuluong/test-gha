name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  lints:
    uses: ./.github/workflows/lints.yml

  tests:
    uses: ./.github/workflows/tests.yml

  build-apk:
    needs: [lints, tests]
    uses: ./.github/workflows/build-apk.yml

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lints, tests, build-apk]

    steps:
      - name: Write Summary
        run: |
          echo "## 📊 Android CI Summary" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🧹 Lint" >> $GITHUB_STEP_SUMMARY
          echo "- Status: **${{ needs.lints.outputs.lint_status }}**" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🧪 Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: **${{ needs.tests.outputs.test_status }}**" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- Status: **${{ needs.build-apk.outputs.build_status }}**" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY